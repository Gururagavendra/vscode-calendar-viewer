<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <!-- Modern calendar icon with transparent background -->
  
  <!-- Main calendar body -->
  <rect x="16" y="28" width="96" height="88" rx="8" fill="#0078D4"/>
  
  <!-- Calendar top bar -->
  <rect x="16" y="28" width="96" height="24" rx="8" fill="#005A9E"/>
  <rect x="16" y="40" width="96" height="12" fill="#005A9E"/>
  
  <!-- Calendar binding rings (white) -->
  <circle cx="32" cy="32" r="4" fill="white"/>
  <circle cx="56" cy="32" r="4" fill="white"/>
  <circle cx="72" cy="32" r="4" fill="white"/>
  <circle cx="96" cy="32" r="4" fill="white"/>
  
  <!-- White area for dates -->
  <rect x="22" y="54" width="84" height="56" fill="white"/>
  
  <!-- Date grid -->
  <line x1="22" y1="68" x2="106" y2="68" stroke="#E5E5E5" stroke-width="1.5"/>
  <line x1="22" y1="82" x2="106" y2="82" stroke="#E5E5E5" stroke-width="1.5"/>
  <line x1="22" y1="96" x2="106" y2="96" stroke="#E5E5E5" stroke-width="1.5"/>
  
  <line x1="42" y1="54" x2="42" y2="110" stroke="#E5E5E5" stroke-width="1.5"/>
  <line x1="62" y1="54" x2="62" y2="110" stroke="#E5E5E5" stroke-width="1.5"/>
  <line x1="82" y1="54" x2="82" y2="110" stroke="#E5E5E5" stroke-width="1.5"/>
  
  <!-- Today highlight (orange accent) -->
  <rect x="64" y="70" width="16" height="10" rx="2" fill="#FFB900"/>
  
  <!-- Event indicators (blue dots) -->
  <circle cx="32" cy="63" r="3" fill="#0078D4"/>
  <circle cx="52" cy="63" r="3" fill="#0078D4"/>
  <circle cx="72" cy="77" r="3" fill="#0078D4"/>
  <circle cx="92" cy="77" r="3" fill="#0078D4"/>
  <circle cx="32" cy="91" r="3" fill="#0078D4"/>
  <circle cx="52" cy="91" r="3" fill="#0078D4"/>
  
  <!-- Email envelope overlay (bottom right corner) -->
  <g transform="translate(72, 82)">
    <!-- Envelope body -->
    <rect x="0" y="0" width="36" height="28" rx="3" fill="white" stroke="#0078D4" stroke-width="2"/>
    <!-- Envelope flap -->
    <path d="M 0 0 L 18 14 L 36 0" fill="none" stroke="#0078D4" stroke-width="2" stroke-linejoin="round"/>
    <!-- Unread dot -->
    <circle cx="32" cy="4" r="5" fill="#D13438"/>
  </g>
</svg>
