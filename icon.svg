<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="128" height="128" rx="20" fill="#0078D4"/>
  
  <!-- Calendar body -->
  <rect x="20" y="30" width="88" height="78" rx="6" fill="white"/>
  
  <!-- Calendar header -->
  <rect x="20" y="30" width="88" height="20" rx="6" fill="#005A9E"/>
  <rect x="20" y="40" width="88" height="10" fill="#005A9E"/>
  
  <!-- Calendar rings -->
  <circle cx="35" cy="35" r="3" fill="white"/>
  <circle cx="55" cy="35" r="3" fill="white"/>
  <circle cx="75" cy="35" r="3" fill="white"/>
  <circle cx="95" cy="35" r="3" fill="white"/>
  
  <!-- Date grid lines -->
  <line x1="20" y1="60" x2="108" y2="60" stroke="#E1E1E1" stroke-width="1"/>
  <line x1="20" y1="75" x2="108" y2="75" stroke="#E1E1E1" stroke-width="1"/>
  <line x1="20" y1="90" x2="108" y2="90" stroke="#E1E1E1" stroke-width="1"/>
  
  <line x1="40" y1="50" x2="40" y2="108" stroke="#E1E1E1" stroke-width="1"/>
  <line x1="60" y1="50" x2="60" y2="108" stroke="#E1E1E1" stroke-width="1"/>
  <line x1="80" y1="50" x2="80" y2="108" stroke="#E1E1E1" stroke-width="1"/>
  
  <!-- Event dots -->
  <circle cx="30" cy="67" r="2.5" fill="#0078D4"/>
  <circle cx="50" cy="67" r="2.5" fill="#0078D4"/>
  <circle cx="70" cy="82" r="2.5" fill="#0078D4"/>
  <circle cx="90" cy="82" r="2.5" fill="#0078D4"/>
  <circle cx="50" cy="97" r="2.5" fill="#0078D4"/>
  
  <!-- Highlight today -->
  <rect x="62" y="77" width="16" height="13" rx="2" fill="#FFB900" opacity="0.3"/>
</svg>
